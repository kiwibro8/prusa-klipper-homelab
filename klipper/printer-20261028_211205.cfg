# ==============================================================================
# Prusa i3 MK3S (Bear 2.1 Frame + Bondtech BMG + E3D V6) - Klipper Configuration
# Board: Ultimachine Einsy RAMBo 1.1a (ATmega2560 @ 16MHz, UART0)
# Host: Raspberry Pi 4 (4GB) running Klipper + Moonraker + Mainsail
# ==============================================================================

[include mainsail.cfg]
[include KAMP_Settings.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Prusa_Research__prusa3d.com__Original_Prusa_i3_MK3____________________-if00
restart_method: arduino

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 12
max_z_accel: 200
square_corner_velocity: 5.0

# ==============================================================================
# X / Y / Z Steppers & Trinamic TMC2130 Hardware SPI Configuration
# ==============================================================================

[stepper_x]
step_pin: PC0
dir_pin: !PL0
enable_pin: !PA7
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2130_stepper_x:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 250
homing_speed: 50
homing_retract_dist: 0

[tmc2130 stepper_x]
cs_pin: PG0
interpolate: True
run_current: 0.281738
hold_current: 0.281738
sense_resistor: 0.220
diag1_pin: !PK2
driver_IHOLDDELAY: 8
driver_TPOWERDOWN: 0
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 1
driver_HSTRT: 5
driver_PWM_FREQ: 2
driver_PWM_GRAD: 2
driver_PWM_AMPL: 230
driver_PWM_AUTOSCALE: True
driver_SGT: 3

[stepper_y]
step_pin: PC1
dir_pin: PL1
enable_pin: !PA6
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2130_stepper_y:virtual_endstop
position_endstop: -4
position_min: -4
position_max: 210
homing_speed: 50
homing_retract_dist: 0

[tmc2130 stepper_y]
cs_pin: PG2
interpolate: True
run_current: 0.3480291
hold_current: 0.3480291
sense_resistor: 0.220
diag1_pin: !PK7
driver_IHOLDDELAY: 8
driver_TPOWERDOWN: 0
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 1
driver_HSTRT: 5
driver_PWM_FREQ: 2
driver_PWM_GRAD: 2
driver_PWM_AMPL: 235
driver_PWM_AUTOSCALE: True
driver_SGT: 3

[stepper_z]
step_pin: PC2
dir_pin: !PL2
enable_pin: !PA5
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 210
homing_speed: 13.333

[tmc2130 stepper_z]
cs_pin: PK5
interpolate: True
run_current: 0.53033
hold_current: 0.53033
sense_resistor: 0.220
diag1_pin: !PK6
driver_IHOLDDELAY: 8
driver_TPOWERDOWN: 0
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 1
driver_HSTRT: 5
driver_PWM_FREQ: 2
driver_PWM_GRAD: 4
driver_PWM_AMPL: 200
driver_PWM_AUTOSCALE: True
driver_SGT: 4

# ==============================================================================
# Extruder: Bondtech BMG (3:1 Gear Ratio) + Genuine E3D V6 All-Metal (0.4mm)
# ==============================================================================

[extruder]
step_pin: PC3
dir_pin: !PL6
enable_pin: !PA4
microsteps: 16
rotation_distance: 7.711
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 200.0
max_extrude_only_velocity: 120.0
max_extrude_only_accel: 1250.0
max_extrude_cross_section: 50.0
heater_pin: PE5
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF0
#control: pid
#pid_Kp: 16.13
#pid_Ki: 1.1625
#pid_Kd: 56.23
min_temp: 0
max_temp: 305
min_extrude_temp: 170
pressure_advance: 0.045
pressure_advance_smooth_time: 0.040

[tmc2130 extruder]
cs_pin: PK4
interpolate: True
run_current: 0.513757
hold_current: 0.513757
sense_resistor: 0.220
diag1_pin: !PK3
driver_IHOLDDELAY: 8
driver_TPOWERDOWN: 0
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 1
driver_HSTRT: 5
driver_PWM_FREQ: 2
driver_PWM_GRAD: 4
driver_PWM_AMPL: 240
driver_PWM_AUTOSCALE: True
driver_SGT: 3

[firmware_retraction]
retract_length: 0.8
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35

# ==============================================================================
# Prusa MK52 Magnetic Heatbed
# ==============================================================================

[heater_bed]
heater_pin: PG5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF2
control: pid
pid_Kp: 126.13
pid_Ki: 4.3
pid_Kd: 924.76
min_temp: 0
max_temp: 125

# ==============================================================================
# SuperPINDA Inductive Probe & 7x7 Bed Mesh Leveling
# ==============================================================================

[probe]
pin: ^PB4
x_offset: 23.0
y_offset: 5.0
#z_offset: 1.000
speed: 10.0
samples: 1
sample_retract_dist: 1.0
lift_speed: 15.0

[safe_z_home]
home_xy_position: 102, 100
speed: 50.0
z_hop: 5.0
z_hop_speed: 15.0

[bed_mesh]
speed: 200
horizontal_move_z: 2
mesh_min: 24, 6
mesh_max: 241, 205
probe_count: 7, 7
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: 0.2
fade_start: 1.0
fade_end: 10.0
adaptive_margin: 5

[screws_tilt_adjust]
# Coordinates so the SuperPINDA (+23, +5 offset) probes directly over MK52 bed standoffs
screw1: 102, 100
screw1_name: Center (Reference)
screw2: 0, 1
screw2_name: Front Left
screw3: 205, 1
screw3_name: Front Right
screw4: 205, 199
screw4_name: Rear Right
screw5: 0, 199
screw5_name: Rear Left
speed: 150
horizontal_move_z: 5
screw_thread: CCW-M3

[idle_timeout]
timeout: 1800

# ==============================================================================
# Fans & Temperature Sensors (Einsy RAMBo + Raspberry Pi 4)
# ==============================================================================

[heater_fan hotend_fan]
pin: PH5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
tachometer_pin: ^PE6
tachometer_poll_interval: 0.0015

[fan]
pin: PH3
tachometer_pin: ^PE7
tachometer_poll_interval: 0.0015

[temperature_sensor einsy_board]
sensor_pin: PF6
sensor_type: TDK NTCG104LH104JT1
min_temp: 0
max_temp: 75

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 85

# ==============================================================================
# Onboard RepRapDiscount 2004 LCD & Rotary Encoder + Beeper (MK3S Stock LCD)
# ==============================================================================

[display]
lcd_type: hd44780
rs_pin: PD5
e_pin: PF7
d4_pin: PF5
d5_pin: PG4
d6_pin: PH7
d7_pin: PG3
encoder_pins: ^PJ1, ^PJ2
click_pin: ^!PH6
line_length: 20
menu_timeout: 40

[output_pin BEEPER_pin]
pin: PH2
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.001
scale: 1000

[static_digital_output yellow_led]
pins: !PB7

# ==============================================================================
# Custom 2004 LCD Menu Items (BMG Load/Unload, Bear Z-Align, Preheats)
# ==============================================================================

[menu __main __bear]
type: list
name: Bear & BMG Tools
index: 1

[menu __main __bear __z_align]
type: command
name: Bear Z-Align
gcode:
    Z_ALIGN_BEAR

[menu __main __bear __load_fil]
type: command
name: Load Filament (BMG)
gcode:
    LOAD_FILAMENT

[menu __main __bear __unload_fil]
type: command
name: Unload Fil. (BMG)
gcode:
    UNLOAD_FILAMENT

[menu __main __bear __preheat_pla]
type: command
name: Preheat PLA 190/55
gcode:
    M140 S55
    M104 S190

[menu __main __bear __preheat_petg]
type: command
name: Preheat PETG 240/85
gcode:
    M140 S85
    M104 S240

[menu __main __bear __cooldown]
type: command
name: Cooldown All
gcode:
    TURN_OFF_HEATERS

# ==============================================================================
# Useful Features & Macros (Mainsail & OrcaSlicer Optimized)
# ==============================================================================

[exclude_object]
[gcode_arcs]
resolution: 0.1
[skew_correction]
[force_move]
enable_force_move: True
[respond]
[pause_resume]

# ==============================================================================
# Prusa MK3S Optical Filament Runout Sensor (Einsy pin PK0)
# ==============================================================================

[filament_switch_sensor fsensor]
pause_on_runout: True
runout_gcode:
    M117 Filament Runout Detected!
    M300 S1000 P200
    G4 P100
    M300 S1500 P300
insert_gcode:
    M117 Filament Inserted
    M300 S1500 P150
switch_pin: ^PK0
[display_status]

[gcode_macro M300]
description: Play tone on LCD beeper
gcode:
    {% set S = params.S|default(1000)|int %}
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 }
    G4 P{P}
    SET_PIN PIN=BEEPER_pin VALUE=0

[gcode_macro M600]
description: Filament change pause with beep
gcode:
    M300 S1500 P200
    G4 P100
    M300 S2000 P300
    PAUSE

[gcode_macro M900]
description: Translate Marlin Linear Advance (M900 Kxx) to Klipper Pressure Advance
gcode:
    {% if 'K' in params %}
        SET_PRESSURE_ADVANCE ADVANCE={params.K|float}
    {% endif %}

[gcode_macro G80]
description: Legacy Prusa G80 mesh leveling alias
gcode:
    BED_MESH_CALIBRATE ADAPTIVE=1

[gcode_macro START_PRINT]
description: Prusa MK3S Bear + BMG No-Ooze Start Print Macro (with KAMP Adaptive Mesh, Smart Park & Line Purge)
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(215)|float %}
    {% set PA = params.PA|default(0.045)|float %}
    {% set USE_KAMP_PURGE = params.KAMP_PURGE|default(0)|int %}

    G90 ; Absolute coordinates
    M83 ; Extruder relative mode
    M220 S100 ; Reset speed factor to 100%
    M221 S100 ; Reset flow factor to 100%
    SET_PRESSURE_ADVANCE ADVANCE={PA}

    ; --- 1. PREHEAT BED & STANDBY NOZZLE (NO OOZE) ---
    M117 Preheating Bed...
    M104 S160 ; Warm nozzle to 160C (prevents dripping & PINDA heat soak)
    M140 S{BED_TEMP} ; Set bed temp
    M190 S{BED_TEMP} ; Wait for bed temp

    ; --- 2. CALIBRATION (HOME + KAMP ADAPTIVE MESH) ---
    M117 Homing & Adaptive Mesh...
    G28 ; Home all axes cleanly
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ; KAMP automatically intercepts this and probes ONLY the model area!

    ; --- 3. PARK & FINAL HEATING ---
    M117 Heating Nozzle...
    {% if USE_KAMP_PURGE == 1 %}
        Smart_Park ; KAMP parks nozzle 3mm above bed right next to the print area
        M109 S{EXTRUDER_TEMP}
        M300 S1200 P80
        M117 Adaptive Purging...
        LINE_PURGE ; KAMP adaptive purge right in front of the part
    {% else %}
        G1 X0 Y-3.0 Z3.0 F5000 ; Park right at front purge line start, safely above bed
        M109 S{EXTRUDER_TEMP} ; Heat to final print temp (any stray drip falls in purge zone)
        M300 S1200 P80 ; Short ready beep
        ; --- 4. PRUSA FRONT PURGE / INTRO LINE + WIPE & SNAP LIFT ---
        M117 Purging...
        G1 Z0.20 F720
        G92 E0
        G1 X60.0 E9.0 F1000.0 ; Intro line segment 1
        G1 X100.0 E12.5 F1000.0 ; Intro line segment 2
        G1 X115.0 E-0.6 F1500.0 ; Fast 15mm wipe forward + 0.6mm retraction
        G1 Z2.0 F1000.0 ; Snap Z lift to break any residual string
        G92 E0
    {% endif %}
    M117 Printing...

[gcode_macro PID_HOTEND]
description: Quick PID tune for E3D V6 Hotend (default 215C)
gcode:
    {% set TEMP = params.TEMP|default(215)|float %}
    M106 S64 ; 25% part fan during PID for realistic printing conditions
    PID_CALIBRATE HEATER=extruder TARGET={TEMP}
    M107
    SAVE_CONFIG

[gcode_macro PID_BED]
description: Quick PID tune for MK52 Heatbed (default 60C)
gcode:
    {% set TEMP = params.TEMP|default(60)|float %}
    PID_CALIBRATE HEATER=heater_bed TARGET={TEMP}
    SAVE_CONFIG

[gcode_macro END_PRINT]
description: Prusa MK3S Bear + BMG Smart End Print Macro
gcode:
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set lift_z = [act_z + 48.0, max_z]|min %}

    M400 ; Wait for all moves in buffer to complete

    ; --- 1. RETRACT & SAFE CLEARANCE ---
    G92 E0
    G91 ; Relative positioning
    G1 E-0.8 F2400 ; Retract 0.8mm to prevent cold heatbreak neck plugs
    G1 Z{ [2.0, max_z - act_z]|min } F720 ; Immediate 2mm hop off the model
    G90 ; Return to absolute positioning

    ; --- 2. PRESENT PART & COOLDOWN ---
    TURN_OFF_HEATERS ; Turn off hotend & bed heaters immediately
    M107 ; Turn off part cooling fan
    G1 X0 Y200 F3600 ; Park carriage left and push bed forward for easy removal
    G1 Z{lift_z} F720 ; Lift gantry up (+48mm up to 210mm Bear limit) for clearance

    ; --- 3. RESET MODES & MOTORS ---
    M221 S100 ; Reset flow multiplier to 100%
    M220 S100 ; Reset speed multiplier to 100%
    SET_PRESSURE_ADVANCE ADVANCE=0.045 ; Reset PA to baseline
    M84 ; Disable stepper motors
    M300 S1000 P120 ; Print finished chime
    G4 P80
    M300 S1500 P200
    M117 Print Complete!

[gcode_macro LOAD_FILAMENT]
description: Load and purge filament through Bondtech BMG (3:1) + E3D V6
gcode:
    {% set target_temp = params.TEMP|default(printer.extruder.target)|float %}
    {% set load_temp = [target_temp, 190.0]|max if target_temp > 0 else 190.0 %}
    {% if printer.extruder.temperature < (load_temp - 5) %}
        M117 Heating to {load_temp}C...
        M109 S{load_temp}
    {% endif %}
    M117 Loading Filament...
    M83
    G1 E45 F600 ; Fast load through BMG gears into V6 heatbreak
    G1 E35 F200 ; Slow purge through 0.4mm nozzle
    G1 E-0.8 F1800 ; Small retract to stop ooze
    M400
    M300 S1500 P150
    M117 Filament Loaded!

[gcode_macro UNLOAD_FILAMENT]
description: Tip-shaping unload for Bondtech BMG + E3D V6 All-Metal
gcode:
    {% set target_temp = params.TEMP|default(printer.extruder.target)|float %}
    {% set unload_temp = [target_temp, 190.0]|max if target_temp > 0 else 190.0 %}
    {% if printer.extruder.temperature < (unload_temp - 5) %}
        M117 Heating to {unload_temp}C...
        M109 S{unload_temp}
    {% endif %}
    M117 Unloading Filament...
    M83
    G1 E5 F300 ; Extrude slightly to melt tip
    G1 E-15 F3000 ; Fast jerk out of meltzone to form clean tip
    G4 P2000 ; Cool tip for 2s in heatbreak
    G1 E-65 F1200 ; Retract completely out of Bondtech BMG gears
    M400
    M300 S1200 P150
    M117 Filament Unloaded!

[gcode_macro Z_ALIGN_BEAR]
description: Mechanical Gantry Calibration against top Z-tops (Prusa Bear 210mm style)
gcode:
    {% if xyz not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    M117 Aligning Bear Z...
    G90
    G1 X125 Y105 F3000
    G1 Z208 F1000
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.18
    FORCE_MOVE STEPPER=stepper_z DISTANCE=6 VELOCITY=4
    G4 P300
    FORCE_MOVE STEPPER=stepper_z DISTANCE=-6 VELOCITY=10
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.53033
    G28 Z
    M300 S1500 P150
    M117 Bear Z Aligned!

