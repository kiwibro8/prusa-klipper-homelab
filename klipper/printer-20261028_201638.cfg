# ==============================================================================
# Prusa i3 MK3S (Bear 2.1 Frame + Bondtech BMG + E3D V6) — Klipper Configuration
# Board: Ultimachine Einsy RAMBo 1.1a (ATmega2560 @ 16MHz, UART0)
# Host: Raspberry Pi 4 (4GB) running Klipper + Moonraker + Mainsail
# ==============================================================================

[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Prusa_Research__prusa3d.com__Original_Prusa_i3_MK3____________________-if00
restart_method: arduino

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 12
max_z_accel: 200
square_corner_velocity: 5.0

# ==============================================================================
# X / Y / Z Steppers & Trinamic TMC2130 Hardware SPI Configuration
# ==============================================================================

[stepper_x]
step_pin: PC0
dir_pin: !PL0
enable_pin: !PA7
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2130_stepper_x:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 250
homing_speed: 50
homing_retract_dist: 0

[tmc2130 stepper_x]
cs_pin: PG0
interpolate: True
run_current: 0.281738
hold_current: 0.281738
sense_resistor: 0.220
diag1_pin: !PK2
driver_IHOLDDELAY: 8
driver_TPOWERDOWN: 0
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 1
driver_HSTRT: 5
driver_PWM_FREQ: 2
driver_PWM_GRAD: 2
driver_PWM_AMPL: 230
driver_PWM_AUTOSCALE: True
driver_SGT: 3

[stepper_y]
step_pin: PC1
dir_pin: PL1
enable_pin: !PA6
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2130_stepper_y:virtual_endstop
position_endstop: -4
position_min: -4
position_max: 210
homing_speed: 50
homing_retract_dist: 0

[tmc2130 stepper_y]
cs_pin: PG2
interpolate: True
run_current: 0.3480291
hold_current: 0.3480291
sense_resistor: 0.220
diag1_pin: !PK7
driver_IHOLDDELAY: 8
driver_TPOWERDOWN: 0
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 1
driver_HSTRT: 5
driver_PWM_FREQ: 2
driver_PWM_GRAD: 2
driver_PWM_AMPL: 235
driver_PWM_AUTOSCALE: True
driver_SGT: 3

[stepper_z]
step_pin: PC2
dir_pin: !PL2
enable_pin: !PA5
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 210
homing_speed: 13.333

[tmc2130 stepper_z]
cs_pin: PK5
interpolate: True
run_current: 0.53033
hold_current: 0.53033
sense_resistor: 0.220
diag1_pin: !PK6
driver_IHOLDDELAY: 8
driver_TPOWERDOWN: 0
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 1
driver_HSTRT: 5
driver_PWM_FREQ: 2
driver_PWM_GRAD: 4
driver_PWM_AMPL: 200
driver_PWM_AUTOSCALE: True
driver_SGT: 4

# ==============================================================================
# Extruder: Bondtech BMG (3:1 Gear Ratio) + Genuine E3D V6 All-Metal (0.4mm)
# ==============================================================================

[extruder]
step_pin: PC3
# Note: On Einsy 1.1a, E0_DIR is PL6 (inverted !PL6 for Bondtech BMG 3:1).
# E0_DIAG1 on TMC2130 is !PK3 (configured below in [tmc2130 extruder]).
dir_pin: !PL6
enable_pin: !PA4
microsteps: 16
rotation_distance: 7.711
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 200.0
max_extrude_only_velocity: 120.0
max_extrude_only_accel: 1250.0
max_extrude_cross_section: 50.0
heater_pin: PE5
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF0
control: pid
pid_Kp: 16.13
pid_Ki: 1.1625
pid_Kd: 56.23
min_temp: 0
max_temp: 305
min_extrude_temp: 170
pressure_advance: 0.045
pressure_advance_smooth_time: 0.040

[tmc2130 extruder]
cs_pin: PK4
interpolate: True
run_current: 0.513757
hold_current: 0.513757
sense_resistor: 0.220
diag1_pin: !PK3
driver_IHOLDDELAY: 8
driver_TPOWERDOWN: 0
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 1
driver_HSTRT: 5
driver_PWM_FREQ: 2
driver_PWM_GRAD: 4
driver_PWM_AMPL: 240
driver_PWM_AUTOSCALE: True
driver_SGT: 3

# ==============================================================================
# Prusa MK52 Magnetic Heatbed
# ==============================================================================

[heater_bed]
heater_pin: PG5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF2
control: pid
pid_Kp: 126.13
pid_Ki: 4.3
pid_Kd: 924.76
min_temp: 0
max_temp: 125

# ==============================================================================
# SuperPINDA Inductive Probe & 7x7 Bed Mesh Leveling
# ==============================================================================

[probe]
pin: ^PB4
x_offset: 23.0
y_offset: 5.0
#z_offset: 1.000
speed: 10.0
samples: 3
sample_retract_dist: 1.0
lift_speed: 15.0
samples_result: average
samples_tolerance: 0.050
samples_tolerance_retries: 3

[safe_z_home]
home_xy_position: 102, 100
speed: 50.0
z_hop: 5.0
z_hop_speed: 15.0

[bed_mesh]
speed: 150
horizontal_move_z: 3
mesh_min: 24, 6
mesh_max: 241, 205
probe_count: 7, 7
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: 0.2
fade_start: 1.0
fade_end: 10.0

# ==============================================================================
# Fans & Temperature Sensors (Einsy RAMBo + Raspberry Pi 4)
# ==============================================================================

[heater_fan hotend_fan]
pin: PH5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
tachometer_pin: ^PE6
tachometer_poll_interval: 0.0015

[fan]
pin: PH3
tachometer_pin: ^PE7
tachometer_poll_interval: 0.0015

[temperature_sensor einsy_board]
sensor_pin: PF6
sensor_type: TDK NTCG104LH104JT1
min_temp: 0
max_temp: 75

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 85

# ==============================================================================
# Onboard RepRapDiscount 2004 LCD & Rotary Encoder + Beeper (MK3S Stock LCD)
# ==============================================================================

[display]
lcd_type: hd44780
rs_pin: PD5
e_pin: PF7
d4_pin: PF5
d5_pin: PG4
d6_pin: PH7
d7_pin: PG3
encoder_pins: ^PJ1, ^PJ2
click_pin: ^!PH6

[output_pin BEEPER_pin]
pin: PH2
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.001
scale: 1000

[static_digital_output yellow_led]
pins: !PB7

# ==============================================================================
# Useful Features & Macros (Mainsail Compatible)
# ==============================================================================

[exclude_object]
[skew_correction]
[force_move]
enable_force_move: True
[respond]
[pause_resume]
[display_status]

[gcode_macro START_PRINT]
description: Standard Prusa MK3S Bear Start Print Macro
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    M140 S{BED_TEMP}
    M104 S160
    G90
    M83
    G28
    M190 S{BED_TEMP}
    BED_MESH_CALIBRATE
    G1 X0 Y-3.0 Z10.0 F3000
    M109 S{EXTRUDER_TEMP}
    # Purge line on front edge of MK52 sheet
    G1 Z0.20 F720
    G92 E0
    G1 X60.0 E9.0 F1000.0
    G1 X100.0 E12.5 F1000.0
    G92 E0

[gcode_macro END_PRINT]
description: Standard Prusa MK3S Bear End Print Macro
gcode:
    M400
    G92 E0
    G1 E-1.5 F2400
    G91
    G1 Z10 F900
    G90
    G1 X10 Y200 F3000
    TURN_OFF_HEATERS
    M107
    M84

[gcode_macro Z_ALIGN_BEAR]
description: Mechanical Gantry Calibration against top Z-tops (Prusa style)
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X125 Y105 F3000
    G1 Z208 F1000
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.18
    FORCE_MOVE STEPPER=stepper_z DISTANCE=6 VELOCITY=4
    G4 P300
    FORCE_MOVE STEPPER=stepper_z DISTANCE=-6 VELOCITY=10
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.53033
    G28 Z

