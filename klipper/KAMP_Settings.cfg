# KAMP Configuration for Prusa i3 MK3S (Bear 2.1 + Bondtech BMG + E3D V6)
[include ./KAMP/Adaptive_Meshing.cfg]
[include ./KAMP/Line_Purge.cfg]
[include ./KAMP/Smart_Park.cfg]

[gcode_macro _KAMP_Settings]
description: KAMP Settings tuned for Prusa MK3S Bear + BMG + E3D V6
variable_verbose_enable: True
variable_mesh_margin: 5
variable_fuzz_amount: 0
variable_probe_dock_enable: False
variable_attach_macro: 'Attach_Probe'
variable_detach_macro: 'Dock_Probe'

# Adaptive Line Purge settings (matches END_PRINT 0.8mm retract & E3D V6 11mm3/s flow)
variable_purge_height: 0.8
variable_tip_distance: 0.8
variable_purge_margin: 10
variable_purge_amount: 25
variable_flow_rate: 11

# Smart Park settings (parks right next to the model at Z=3mm for final heating)
variable_smart_park_height: 3

gcode:
    {action_respond_info("KAMP Settings Loaded.")}
