version: "3.8"

services:
  # -------------------------------------------------------------------------
  # 1. Pi-hole: Network-wide Ad & Tracker Blocker
  # -------------------------------------------------------------------------
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8088:80/tcp"  # Web Admin Dashboard at http://<pi-ip>:8088/admin
    environment:
      TZ: "Europe/Bucharest"
      WEBPASSWORD: "ChangeMeAdmin2026!" # Parola initiala pentru dashboard-ul web
      DNSMASQ_USER: "root"
      FTLCONF_LOCAL_IPV4: "0.0.0.0"
    volumes:
      - ./data/pihole:/etc/pihole
      - ./data/dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE

  # -------------------------------------------------------------------------
  # 2. Tailscale: Zero-Config Mesh VPN (Access from phone/laptop anywhere)
  # -------------------------------------------------------------------------
  tailscale:
    container_name: tailscale
    image: tailscale/tailscale:latest
    restart: unless-stopped
    network_mode: "host"
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW

  # -------------------------------------------------------------------------
  # 3. Uptime Kuma: Beautiful Service Monitor (OLX Bot, PrusaLink, Pi-hole)
  # -------------------------------------------------------------------------
  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "3001:3001"  # Web Dashboard at http://<pi-ip>:3001
    volumes:
      - ./data/uptime-kuma:/app/data

  # -------------------------------------------------------------------------
  # 4. Portainer: Web GUI for 1-Click Docker Management
  # -------------------------------------------------------------------------
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9000:9000"  # Web UI at http://<pi-ip>:9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
